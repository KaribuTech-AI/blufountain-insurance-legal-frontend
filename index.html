<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      try {
        var t = localStorage.getItem('bf-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t;
          document.querySelector('meta[name="color-scheme"]').content = t;
        }
      } catch (e) {}
    </script>
    <meta name="theme-color" content="#0b1628" />
    <meta
      name="description"
      content="Free legal help from Blufountain. Check your case or ask for help in English, Shona or Ndebele."
    />
    <title>Blufountain Legal Aid</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
